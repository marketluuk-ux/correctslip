name: Keep Render service awake

# Render's free web service suspends after 15 minutes with no incoming
# request. This pings it every 10 minutes so it never goes idle that long.
# GitHub's schedule is "best effort" and can slip by a few minutes under
# load, so this reduces cold starts a lot but doesn't guarantee zero.
#
# This does NOT fix the free Postgres database's separate 30-day
# expiration — there is no traffic-based workaround for that; it needs an
# actual plan upgrade before it expires.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        run: |
          curl -sS --max-time 25 -o /dev/null -w "status: %{http_code}\n" \
            https://correctslip.onrender.com/api/tier-prices || \
            echo "Ping failed — likely a cold start or transient issue, not necessarily a real problem."
